aid: clerk
url: https://raw.githubusercontent.com/api-evangelist/clerk/refs/heads/main/apis.yml
name: Clerk
kind: company
description: Clerk is a drop-in authentication and user management platform for web
  and mobile applications. The product spans sign-up / sign-in flows, user profiles,
  multi-factor authentication, passkeys, social sign-on, magic links, bot and fraud
  detection, organizations (B2B / multi-tenant) with custom roles and invitations,
  and a Billing product for subscriptions. The Backend API at api.clerk.com is authenticated
  with a Bearer secret key and has an OpenAPI specification. Frontend SDKs cover Next.js,
  React, React Router, Expo, Astro, TanStack React Start, Chrome Extension, and vanilla
  JavaScript. Backend SDKs cover Node, Go, Python, Ruby, Java, PHP, and C#. Webhooks
  are delivered via Svix.
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup
