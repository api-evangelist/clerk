aid: clerk
url: https://raw.githubusercontent.com/api-evangelist/clerk/refs/heads/main/apis.yml
name: Clerk
kind: company
description: Clerk is a drop-in authentication and user management platform for web
  and mobile applications. The product spans sign-up / sign-in flows, user profiles,
  multi-factor authentication, passkeys, social sign-on, magic links, bot and fraud
  detection, organizations (B2B / multi-tenant) with custom roles and invitations,
  and a Billing product for subscriptions. The Backend API at api.clerk.com is authenticated
  with a Bearer secret key and has an OpenAPI specification. Frontend SDKs cover Next.js,
  React, React Router, Expo, Astro, TanStack React Start, Chrome Extension, and vanilla
  JavaScript. Backend SDKs cover Node, Go, Python, Ruby, Java, PHP, and C#. Webhooks
  are delivered via Svix.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Authentication
- User Management
- Identity
- Passkeys
- MFA
- B2B
- Organizations
- Billing
created: '2026-05-23'
modified: '2026-05-30'
specificationVersion: '0.19'
apis:
- aid: clerk:backend-api
  name: Clerk Backend API
  description: Server-to-server REST API for managing users, sessions, organizations,
    organization memberships, organization invitations, JWT templates, sign-in tokens,
    OAuth applications, SAML connections, allowlist / blocklist identifiers, actor
    tokens, webhooks, and instance settings. Authenticated with a Bearer secret key
    (sk_test_... or sk_live_...). Versioned under /v1.
  humanURL: https://clerk.com/docs/reference/backend-api
  baseURL: https://api.clerk.com
  tags:
  - Backend
  - REST
  - Users
  - Sessions
  - Organizations
  properties:
  - type: Documentation
    url: https://clerk.com/docs/reference/backend-api
  - type: OpenAPI
    url: https://github.com/clerk/openapi-specs
  - url: graphql/clerk-graphql.md
    type: GraphQL
- aid: clerk:frontend-api
  name: Clerk Frontend API
  description: Browser-facing API consumed by Clerk's frontend SDKs and ClerkJS for
    sign-up, sign-in, session refresh, and user profile mutations. Endpoint is instance-specific
    (subdomain on clerk.accounts.dev or a customer vanity domain). Authenticated with
    the publishable key and short-lived client tokens.
  humanURL: https://clerk.com/docs/reference/frontend-api
  baseURL: https://clerk.accounts.dev
  tags:
  - Frontend
  - REST
  - Sessions
  properties:
  - type: Documentation
    url: https://clerk.com/docs/reference/frontend-api
- aid: clerk:webhooks
  name: Clerk Webhooks (Svix)
  description: Webhook events delivered via Svix for user, session, organization,
    email, SMS, and role lifecycle changes. Customers configure endpoints in the dashboard
    and verify signatures with the Svix libraries.
  humanURL: https://clerk.com/docs/integrations/webhooks/overview
  baseURL: customer-configured
  tags:
  - Webhooks
  - Events
  - Svix
  properties:
  - type: Documentation
    url: https://clerk.com/docs/integrations/webhooks/overview
  - type: AsyncAPI
    url: https://raw.githubusercontent.com/api-evangelist/clerk/refs/heads/main/asyncapi/clerk-webhooks-asyncapi.yml
