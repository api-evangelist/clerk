apis:
- aid: clerk:frontend-api
  name: Clerk Frontend API
  description: >-
    Browser-facing API consumed by Clerk's frontend SDKs and ClerkJS for sign-up, sign-in, session refresh,
    and user profile mutations. Endpoint is instance-specific (subdomain on clerk.accounts.dev or a customer
    vanity domain). Authenticated with the publishable key and short-lived client tokens.
  humanURL: https://clerk.com/docs/reference/frontend-api
  baseURL: https://clerk.accounts.dev
  tags:
  - Frontend
  - REST
  - Sessions
  properties:
  - type: Documentation
    url: https://clerk.com/docs/reference/frontend-api
- aid: clerk:webhooks
  name: Clerk Webhooks (Svix)
  description: >-
    Webhook events delivered via Svix for user, session, organization, email, SMS, and role lifecycle
    changes. Customers configure endpoints in the dashboard and verify signatures with the Svix libraries.
  humanURL: https://clerk.com/docs/integrations/webhooks/overview
  baseURL: customer-configured
